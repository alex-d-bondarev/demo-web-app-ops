name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Set up kubeconform
        uses: bmuschko/setup-kubeconform@v1
        with:
          version: v0.6.7

      - name: Validate ArgoCD Applications
        run: |
          find argocd -name '*.yaml' -exec kubeconform -strict -summary -ignore-missing-schemas {} \;

      - name: Lint Helm Chart
        run: |
          helm lint deploy/

      - name: Helm Template (dry-run)
        run: |
          helm template demo-web-app deploy/ \
            --namespace demo-web-app \
            --values deploy/values.yaml

  k3d-deploy:
    name: k3d Integration Test
    runs-on: ubuntu-latest
    # Runs in parallel with lint (no needs: lint)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up k3d
        uses: AbsaOSS/k3d-action@v2
        with:
          version: v5.6.0
          cluster_name: test-cluster
          args: --servers 1 --agents 2

      - name: Install ArgoCD
        run: |
          kubectl create namespace argocd
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.10.0/manifests/install.yaml
          kubectl wait --for=condition=Available --timeout=120s deployment/argocd-server -n argocd

      - name: Install Envoy Gateway CRDs
        run: |
          kubectl apply -f https://github.com/envoyproxy/gateway/releases/download/v1.10.0/crds.yaml

      - name: Deploy App of Apps
        run: |
          kubectl apply -f argocd/app-of-apps.yaml

      - name: Wait for Envoy Gateway
        run: |
          kubectl wait --for=condition=Available --timeout=180s deployment/envoy-gateway -n envoy-gateway-system

      - name: Wait for Demo Web App
        run: |
          kubectl wait --for=condition=Available --timeout=180s deployment/frontend -n demo-web-app

      - name: Verify Gateway & HTTPRoute
        run: |
          kubectl get gateway -n envoy-gateway-system
          kubectl get httproute -n demo-web-app
