name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quick-check:
    name: Quick Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubeconform
        uses: bmuschko/setup-kubeconform@v1
        with:
          version: v0.6.7

      - name: Lint Helm Chart
        run: helm lint deploy/

      - name: Helm Template (dry-run)
        run: helm template demo-web-app deploy/ --namespace demo-web-app --values deploy/values.yaml

      - name: Validate with kubeconform
        run: |
          find argocd -name '*.yaml' -exec kubeconform -strict -summary -ignore-missing-schemas {} \;

  k3d-deploy:
    name: k3d Integration Test
    runs-on: ubuntu-latest
    needs: quick-check
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d cluster create test-cluster --servers 1 --agents 2

      - name: Install ArgoCD
        run: |
          kubectl create namespace argocd
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/v2.10.0/manifests/install.yaml
          kubectl wait --for=condition=Available --timeout=120s deployment/argocd-server -n argocd
          kubectl wait --for=condition=Available --timeout=120s deployment/argocd-repo-server -n argocd
          kubectl wait --for=condition=Ready --timeout=120s pod -l app.kubernetes.io/name=argocd-application-controller -n argocd

      - name: Deploy App of Apps
        run: |
          kubectl apply -f argocd/app-of-apps.yaml

      - name: Wait for App of Apps Application
        run: |
          attempts=20
          until [ $attempts -eq 0 ]; do
            if kubectl get application app-of-apps -n argocd >/dev/null 2>&1; then
              echo "App of Apps Application exists"
              exit 0
            fi
            echo "Waiting for App of Apps Application... (attempts left: $attempts)"
            attempts=$((attempts - 1))
            sleep 2
          done
          echo "=== DEBUG: App of Apps not found ==="
          kubectl get applications -n argocd || true
          echo "Timeout waiting for App of Apps Application"
          exit 1

      - name: Sync App of Apps
        run: |
          kubectl patch application app-of-apps -n argocd --type merge -p '{"operation":"Sync","syncStrategy":{"apply":{"force":true}}}' 2>/dev/null || true

      - name: Wait for App of Apps to be Synced and Healthy
        run: |
          attempts=20
          until [ $attempts -eq 0 ]; do
            SYNC_STATUS=$(kubectl get application app-of-apps -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "Unknown")
            HEALTH_STATUS=$(kubectl get application app-of-apps -n argocd -o jsonpath='{.status.health.status}' 2>/dev/null || echo "Unknown")
            if [ "$SYNC_STATUS" = "Synced" ] && [ "$HEALTH_STATUS" = "Healthy" ]; then
              echo "App of Apps synced and healthy"
              exit 0
            fi
            echo "App of Apps sync: $SYNC_STATUS, health: $HEALTH_STATUS (attempts left: $attempts)"
            attempts=$((attempts - 1))
            sleep 5
          done
          echo "=== DEBUG: App of Apps final status ==="
          kubectl get application app-of-apps -n argocd -o yaml || true
          echo "Timeout waiting for App of Apps to be Synced and Healthy"
          exit 1

      - name: Wait for child Applications
        run: |
          attempts=20
          until [ $attempts -eq 0 ]; do
            if kubectl get application envoy-gateway -n argocd >/dev/null 2>&1 && \
               kubectl get application argocd-demo-web-app -n argocd >/dev/null 2>&1; then
              echo "Child Applications exist"
              exit 0
            fi
            echo "Waiting for child Applications... (attempts left: $attempts)"
            attempts=$((attempts - 1))
            sleep 2
          done
          echo "=== DEBUG: Child Applications not found ==="
          kubectl get applications -n argocd || true
          echo "Timeout waiting for child Applications"
          exit 1

      - name: Wait for envoy-gateway-system namespace
        run: |
          attempts=20
          until [ $attempts -eq 0 ]; do
            if kubectl get namespace envoy-gateway-system >/dev/null 2>&1; then
              echo "Namespace envoy-gateway-system exists"
              exit 0
            fi
            echo "Waiting for envoy-gateway-system namespace... (attempts left: $attempts)"
            attempts=$((attempts - 1))
            sleep 2
          done
          echo "=== DEBUG: Namespace not found ==="
          kubectl get namespaces || true
          echo "Timeout waiting for namespace"
          exit 1

      - name: Wait for Envoy Gateway
        run: |
          kubectl wait --for=condition=Available --timeout=180s deployment/envoy-gateway -n envoy-gateway-system

      - name: Wait for Demo Web App
        run: |
          kubectl wait --for=condition=Available --timeout=180s deployment/frontend -n demo-web-app

      - name: Verify Gateway & HTTPRoute
        run: |
          kubectl get gateway -n envoy-gateway-system
          kubectl get httproute -n demo-web-app

      - name: Run Helm tests
        run: |
          helm test argocd-demo-web-app -n demo-web-app --timeout 120s
