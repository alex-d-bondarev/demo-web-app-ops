apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews-service
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reviews-service
  template:
    metadata:
      labels:
        app: reviews-service
    spec:
      containers:
      - name: reviews-service
        image: "{{ .Values.global.imageRegistry }}/reviews-service:{{ .Chart.AppVersion }}"
        env:
        - name: DB_HOST
          value: "mysql"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "{{ .Values.mysql.database }}"
        - name: DB_USER
          value: "root"
        - name: DB_PASSWORD
          value: "{{ .Values.mysql.rootPassword }}"
        - name: FRONT_END_URL
          value: "http://frontend:{{ .Values.frontend.port }}"
        ports:
        - containerPort: {{ .Values.reviewsService.port }}
          name: http
---
apiVersion: v1
kind: Service
metadata:
  name: reviews-service
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  ports:
  - port: {{ .Values.reviewsService.port }}
    targetPort: {{ .Values.reviewsService.port }}
    name: http
  selector:
    app: reviews-service
