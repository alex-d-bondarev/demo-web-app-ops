atlas:
  image: arigaio/atlas:latest

frontend:
  port: 9010

global:
  imageRegistry: ghcr.io/alex-d-bondarev
  namespace: demo-web-app

ingress:
  className: nginx
  tls:
    enabled: false
    secretName: ""
  hosts:
    - host: demo-web-app.local
      paths:
        - path: /
          pathType: Prefix
          service:
            name: frontend
            port: 9010

itemsService:
  port: 9020

mysql:
  image: mysql:8.0
  database: im_db
  rootPassword: root

reviewsService:
  port: 9030

wiremock:
  image: wiremock/wiremock:latest
  port: 8080
