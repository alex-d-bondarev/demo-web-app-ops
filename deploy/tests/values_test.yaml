# helm-unittest test file
# Run with: helm unittest deploy/
# CI: helm/unittest-action@v1

suite: test demo-web-app chart
templates:
  - templates/*.yaml
values:
  - ../values.yaml

tests:
  - it: should create namespace with correct name
    template: templates/00-namespace.yaml
    asserts:
      - isKind:
          of: Namespace
      - equal:
          path: metadata.name
          value: demo-web-app

  - it: should create mysql deployment
    template: templates/01-mysql.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: mysql
      - equal:
          path: spec.replicas
          value: 1
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: mysql:8\.0

  - it: should create frontend deployment
    template: templates/06-frontend.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: frontend
      - equal:
          path: spec.replicas
          value: 1
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: frontend:1\.3\.0

  - it: should create gateway in envoy-gateway-system namespace
    template: templates/07-gateway.yaml
    documentSelector:
      path: kind
      value: Gateway
    asserts:
      - isKind:
          of: Gateway
      - equal:
          path: metadata.name
          value: demo-web-app-gateway
      - equal:
          path: metadata.namespace
          value: envoy-gateway-system
      - equal:
          path: spec.gatewayClassName
          value: envoy

  - it: should create httproute pointing to frontend
    template: templates/07-gateway.yaml
    documentSelector:
      path: kind
      value: HTTPRoute
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: metadata.name
          value: frontend
      - equal:
          path: metadata.namespace
          value: demo-web-app
      - equal:
          path: spec.hostnames[0]
          value: demo-web-app.local

  - it: should create atlas migration job
    template: templates/02-atlas-migration.yaml
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: atlas-migration-1-3-0
